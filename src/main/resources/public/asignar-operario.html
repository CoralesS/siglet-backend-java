<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Operario</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        nav { background-color: #2c3e50; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        nav a { color: white; text-decoration: none; padding: 10px 20px; font-weight: bold; font-size: 16px; margin-right: 10px; border-radius: 3px; }
        nav a:hover { background-color: #34495e; }
        .activo { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #2980b9; color: white; }
        .btn-accion { background-color: #2980b9; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; }
        .btn-asignar { background-color: #f39c12; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>

<nav>
    <a href="panel-supervisor.html">📊 Panel de Monitoreo</a>
    <a href="asignar-operario.html" class="activo">👤 Asignar Operarios</a>
</nav>

<h2>Operarios Disponibles para Etiquetado</h2>
<button class="btn-accion" onclick="cargarOperarios()">Buscar Operarios Libres</button>

<table>
    <thead>
    <tr>
        <th>ID / DNI</th>
        <th>Nombre del Operario</th>
        <th>Acción</th>
    </tr>
    </thead>
    <tbody id="tabla-operarios">
    </tbody>
</table>

<script>
    function cargarOperarios() {
        fetch('http://localhost:8080/api/operario/disponibles')
            .then(res => res.json())
            .then(datos => {
                const cuerpo = document.getElementById('tabla-operarios');
                cuerpo.innerHTML = '';
                datos.forEach(op => {
                    cuerpo.innerHTML += `
                        <tr>
                            <td>${op.idOperario}</td>
                            <td>${op.nombreOperario}</td>
                            <td><button class="btn-asignar">Asignar a Máquina</button></td>
                        </tr>
                    `;
                });
            })
            .catch(err => console.error("Error conectando al backend:", err));
    }
    cargarOperarios();
</script>
</body>
</html>
