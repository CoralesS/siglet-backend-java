<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Monitoreo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        nav { background-color: #2c3e50; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        nav a { color: white; text-decoration: none; padding: 10px 20px; font-weight: bold; font-size: 16px; margin-right: 10px; border-radius: 3px; }
        nav a:hover { background-color: #34495e; }
        .activo { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        .btn-accion { background-color: #27ae60; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; }
        .urgente { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <a href="panel-supervisor.html" class="activo">📊 Panel de Monitoreo</a>
    <a href="asignar-operario.html">👤 Asignar Operarios</a>
</nav>

<h2>Panel Supervisor de Lotes</h2>
<button class="btn-accion" onclick="cargarMonitoreo()">Actualizar Datos de Lotes</button>

<table>
    <thead>
    <tr>
        <th>Lote</th>
        <th>Prioridad</th>
        <th>Máquina</th>
        <th>Operario Asignado</th>
    </tr>
    </thead>
    <tbody id="tabla-cuerpo">
    </tbody>
</table>

<script>
    function cargarMonitoreo() {
        fetch('http://localhost:8080/api/lote/monitoreo')
            .then(respuesta => respuesta.json())
            .then(datos => {
                const cuerpoTabla = document.getElementById('tabla-cuerpo');
                cuerpoTabla.innerHTML = '';
                datos.forEach(fila => {
                    const textoPrioridad = fila.esUrgente ? '<span class="urgente">Urgente</span>' : 'Normal';
                    cuerpoTabla.innerHTML += `
                        <tr>
                            <td>${fila.codigoLote}</td>
                            <td>${textoPrioridad}</td>
                            <td>${fila.nombreMaquina}</td>
                            <td>${fila.nombreOperario}</td>
                        </tr>
                    `;
                });
            })
            .catch(error => console.error("Error de conexión:", error));
    }
    cargarMonitoreo();
</script>
</body>
</html>
